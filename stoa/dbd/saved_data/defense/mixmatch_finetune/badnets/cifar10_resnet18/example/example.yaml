---
pretrain_config_path: config/defense/simclr/badnets/cifar10_resnet18/example.yaml
pretrain_checkpoint: epoch100.pt
prefetch: False  # turn on prefetch mode will speedup io
transform:
  pre:
    resize:
      size: 32
  train:
    primary:
      random_crop:
        size: 32
        padding: 4
        padding_mode: reflect
      random_horizontal_flip:
        p: 0.5
    remaining:
      to_tensor: True
      normalize:
        mean: [0.4914, 0.4822, 0.4465]
        std: [0.247, 0.243, 0.261]
  test:
    primary: null
    remaining:
      to_tensor: True
      normalize:
        mean: [0.4914, 0.4822, 0.4465]
        std: [0.247, 0.243, 0.261]
network:
  resnet18_cifar:
    num_classes: 10
warmup:
  loader:
    batch_size: 512
    num_workers: 0
    pin_memory: True
  criterion:
    sce:
      alpha: 0.1
      beta: 1
      num_classes: 10
  num_epochs: 20
semi:
  epsilon: 0.5
  loader:
    batch_size: 512
    num_workers: 4
    pin_memory: True
  criterion:
    mixmatch:
      lambda_u: 15  # 75*(200/1024)~=15
      # gradually increasing lambda_u in the whole training process
      # seems to lead to better results.
      rampup_length: 190  # same as num_epochs or 16 (in the official implementation)
  mixmatch:
    train_iteration: 1024
    temperature: 0.5
    alpha: 0.75
    num_classes: 10
  num_epochs: 170
optimizer:
  Adam:
    lr: 0.0001
#optimizer:
#  SGD:
#    weight_decay: 1.e-4
#    momentum: 0.9
#    lr: 1.e-4
lr_scheduler: null